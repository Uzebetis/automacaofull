name: Enviar jogos do dia para o Telegram

# ===================================================================
# COMO MUDAR O HORÁRIO VOCÊ MESMO:
# A linha "cron" abaixo usa horário UTC, não horário de Brasília.
# Fórmula: hora_UTC = hora_Brasília + 3
#
# Exemplos prontos:
#   Quer rodar às 08:30 (Brasília)? -> UTC = 11:30 -> cron: "30 11 * * *"
#   Quer rodar às 00:05 (Brasília)? -> UTC = 03:05 -> cron: "5 3 * * *"
#   Quer rodar às 06:00 (Brasília)? -> UTC = 09:00 -> cron: "0 9 * * *"
#   Quer rodar às 20:15 (Brasília)? -> UTC = 23:15 -> cron: "15 23 * * *"
#
# O formato é: "MINUTO HORA * * *" (sempre nessa ordem, minuto primeiro)
# Depois de editar, é só clicar em "Commit changes" no GitHub que já
# vale a partir da próxima execução, sem precisar mexer em mais nada.
# ===================================================================
on:
  schedule:
    - cron: "00 08 * * *"   # 05:00 horário de Brasília
  workflow_dispatch: {}

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar script
        env:
          FULLTRADER_ACCESS_TOKEN: ${{ secrets.FULLTRADER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fulltrader_telegram.py
